[project]
name = "conversor"
version = "0.1.0"
description = "Offline, private file converter for Windows"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "nvidia-cudnn-cu12==9.10.2.21",
    "onnxruntime-gpu[cuda,cudnn]==1.26.0",
    "openpyxl>=3.1.5",
    "pikepdf>=10.16.0",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.0",
    "pypdfium2>=5.14.0",
    "pyside6>=6.10",
    "pywin32>=312",
    "pyyaml>=6.0.3",
    "rapidocr>=3.10.0",
    "resvg-py>=0.5.0",
]

[project.scripts]
conversor = "conversor:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
